<title>Step 1 trays mockup</title>
<style>
  :root {
    --primary:#004aad; --primary-50:#f0f4fa; --ink:#111827; --body:#4b5563; --muted:#6b7280; --subtle:#9ca3af;
    --surface:#ffffff; --surface-subtle:#f9fafb; --ground:#f8f7f9; --line:#e5e7eb;
    --success:#16a34a; --success-soft:#f0fdf4; --success-border:#bbf7d0;
    --warning:#d97706; --warning-soft:#fffbeb; --warning-border:#fde68a;
    --danger:#dc2626; --danger-soft:#fef2f2;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink);
         font-family:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .frame { max-width:1240px; margin:0 auto; padding:28px 24px 40px; }
  .frame-label { font-size:13px; color:var(--muted); margin:0 0 10px; }
  .row { display:flex; gap:24px; align-items:flex-start; }
  .left { flex:65 1 0; min-width:0; }
  .right { flex:35 1 0; min-width:0; }

  /* One card holds the heading, the photo and the trays: Step 1 reads as one unit */
  .step-card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
               box-shadow:0 1px 2px rgba(17,24,39,.06); overflow:hidden; }
  .step-head { padding:16px 18px 12px; }
  .step-head h2 { font-family:"Ysabeau", "Plus Jakarta Sans", sans-serif; font-size:20px; margin:0 0 4px; }
  .step-head p { margin:0; font-size:13.5px; line-height:1.5; color:var(--body); max-width:72ch; }
  .well { background:var(--surface-subtle); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px; }

  .box { position:absolute; border:2px dashed var(--warning); }
  .box.solid { border-style:solid; border-width:3px; }
  .box.yes { border-color:var(--success); }
  .box.no { border-color:var(--warning); }
  .box.drawn { border-color:var(--primary); }
  .box .tag { position:absolute; left:-3px; top:-20px; font-size:11px; font-weight:700; padding:1px 5px; border-radius:4px;
              background:var(--warning); color:var(--ink); white-space:nowrap; }
  .box.yes .tag { background:var(--success); color:#fff; }
  .box.drawn .tag { background:var(--primary); color:#fff; }

  /* Answer area, directly under the photo */
  .answers { padding:14px 18px 16px; }
  .answers-top { display:flex; align-items:center; gap:16px; justify-content:space-between; margin-bottom:10px; }
  .todo { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:30px; }
  .todo-label { font-size:13px; font-weight:700; }
  .todo-hint { font-size:12px; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12px; font-weight:600; color:var(--ink);
          background:var(--warning-soft); border:1.5px dashed var(--warning); border-radius:12px; padding:3px 9px; cursor:pointer; }
  .chip.drawn { background:var(--primary-50); border-color:var(--primary); }
  .done-note { font-size:13px; color:var(--success); font-weight:700; }
  .meter { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .meter-text { font-size:12.5px; color:var(--body); white-space:nowrap; }
  .meter-text b { color:var(--ink); }
  .bar { width:140px; height:8px; border-radius:99px; background:var(--line); overflow:hidden; display:flex; }
  .bar span { display:block; height:100%; }
  .bar .s-no { background:var(--warning); }
  .bar .s-yes { background:var(--success); }

  .trays { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tray { border-radius:14px; border:1px solid var(--line); background:var(--surface-subtle); padding:12px; }
  .tray-head { display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .swatch { width:16px; height:11px; border-radius:3px; border:3px solid; align-self:center; }
  .tray.no .swatch { border-color:var(--warning); }
  .tray.yes .swatch { border-color:var(--success); }
  .tray-title { font-family:"Ysabeau", "Plus Jakarta Sans", sans-serif; font-size:17px; font-weight:700; margin:0; }
  .count { margin-left:auto; font-size:12px; font-weight:700; border-radius:99px; padding:1px 9px; }
  .tray.no .count { background:var(--warning-soft); color:#92400e; border:1px solid var(--warning-border); }
  .tray.yes .count { background:var(--success-soft); color:#166534; border:1px solid var(--success-border); }
  .tray-sub { font-size:12px; color:var(--muted); margin:0 0 10px; }
  .slots { display:grid; grid-template-columns:repeat(auto-fill, 112px); gap:8px; }

  .tile { position:relative; width:112px; background:var(--surface); border-radius:12px; padding:4px 4px 6px; border:2px solid;
          font:inherit; text-align:left; cursor:pointer; animation:land .18s ease-out both; }
  .tray.no .tile { border-color:var(--warning); }
  .tray.yes .tile { border-color:var(--success); }
  .tile.drawn { box-shadow:0 0 0 2px var(--primary-50), inset 0 0 0 1px var(--primary); }
  .thumb { width:100px; height:100px; border-radius:8px; background-color:#e5e7eb; background-repeat:no-repeat; }
  .tile-label { display:block; font-size:12px; font-weight:700; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pips { display:flex; gap:3px; margin-top:4px; }
  .pip { width:8px; height:8px; border-radius:99px; background:var(--line); }
  .pip.on { background:var(--success); }
  .needs { display:inline-block; margin-top:4px; font-size:11px; font-weight:700; color:var(--danger); background:var(--danger-soft); border-radius:6px; padding:1px 6px; }
  .mine { display:block; font-size:11px; font-weight:700; color:var(--primary); margin-top:1px; }
  .acts { position:absolute; right:7px; top:7px; display:flex; gap:4px; }
  .act { width:24px; height:24px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.95);
         display:grid; place-items:center; font-size:13px; color:var(--body); }
  .ghost { width:112px; border:2px dashed #d1d5db; border-radius:12px; min-height:142px; display:grid; place-items:center; color:var(--subtle); font-size:22px; }
  .empty-hint { grid-column:1 / -1; font-size:12.5px; color:var(--muted); margin:2px 0 4px; }
  @keyframes land { from { transform:scale(.92); opacity:.4; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .tile { animation:none; } }

  .side { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; color:var(--muted); font-size:13px; }
  .side h2 { font-family:"Ysabeau", sans-serif; font-size:20px; color:var(--ink); margin:0 0 6px; }
  .q { height:64px; border-radius:12px; background:var(--surface-subtle); border:1px solid var(--line); margin-top:10px; }
</style>

const TILE = 92;
function boxes(state) {
  return objs.filter(o => state[o.id] !== undefined).map(o => {
    const st = state[o.id];
    const cls = o.drawn ? "solid drawn" : st === "yes" ? "solid yes" : st === "no" ? "solid no" : "";
    const tag = o.drawn ? o.label : (st === "todo" ? o.label : o.label);
    return `<div class="box ${cls}" style="left:${o.m.x/W*100}%;top:${o.m.y/H*100}%;width:${o.m.width/W*100}%;height:${o.m.height/H*100}%"><span class="tag" style="${o.m.y < 22 ? 'top:2px;left:2px' : ''}">${tag}</span></div>`;
  }).join("");
}
function tile(o, tray, sev, showActs) {
  const pips = tray === "yes" ? `<div class="pips" aria-label="Severity ${sev} of 5">${[1,2,3,4,5].map(i => `<span class="pip ${i <= sev ? "on" : ""}"></span>`).join("")}</div>` : "";
  return `<button class="tile ${o.drawn ? "drawn" : ""}" title="${o.label}" aria-label="${o.label}">
    <div class="thumb" style="${thumbStyle(o.m, 100)}"></div>
    ${showActs ? `<span class="acts"><span class="act" title="Move to ${tray === "yes" ? "Not obstructions" : "Obstructions"}">&#8644;</span>${o.drawn ? `<span class="act" title="Delete box">&#128465;</span>` : ""}</span>` : ""}
    <span class="tile-label">${o.label}</span>${o.drawn ? `<span class="mine">Drawn by you</span>` : ""}${pips}</button>`;
}

        <div class="todo">${todo.length
          ? `<span class="todo-label">Still to decide (${todo.length})</span>${todo.map(o => `<button class="chip ${o.drawn ? "drawn" : ""}">${o.label}</button>`).join("")}<span class="todo-hint">Click one to answer it.</span>`
          : `<span class="done-note">Every object is sorted.</span>`}</div>
        <div class="meter"><span class="meter-text"><b>${sorted} of ${total}</b> sorted</span>
          <span class="bar"><span class="s-no" style="width:${no.length/total*100}%"></span><span class="s-yes" style="width:${yes.length/total*100}%"></span></span></div>
      </div>
      <div class="trays">
        <section class="tray no" aria-labelledby="t-no-${el.id}"><div class="tray-head"><span class="swatch"></span><h3 class="tray-title" id="t-no-${el.id}">Not obstructions</h3><span class="count">${no.length}</span></div>
          <p class="tray-sub">Objects you answered No. They are there, but not in your way.</p>
          <div class="slots">${no.length ? "" : `<p class="empty-hint">Answer No on an object and it lands here.</p>`}${no.map((o,i) => tile(o, "no", 0, acts && i === 0)).join("")}${ghosts(ghostFor(no.length))}</div></section>
        <section class="tray yes" aria-labelledby="t-yes-${el.id}"><div class="tray-head"><span class="swatch"></span><h3 class="tray-title" id="t-yes-${el.id}">Obstructions</h3><span class="count">${yes.length}</span></div>
          <p class="tray-sub">Objects you answered Yes, with how severe they are.</p>
          <div class="slots">${yes.length ? "" : `<p class="empty-hint">Answer Yes on an object and it lands here.</p>`}${yes.map((o,i) => tile(o, "yes", sev[o.id] || 0, acts && o.drawn)).join("")}${ghosts(ghostFor(yes.length))}</div></section>
      </div>
    </div></div></div>
    <div class="right"><div class="side"><h2>Step 2: Rate the Sidewalk</h2>Unchanged. Shown for context.<div class="q"></div><div class="q"></div><div class="q"></div></div></div></div>`;
}
render(document.getElementById("start"), "At the start of an image: nothing answered yet, the trays show where answers will go.",
  {a:"todo",b:"todo",c:"todo",d:"todo",e:"todo",f:"todo"}, {}, false);
render(document.getElementById("progress"), "Part way: five objects sorted, one drawn by the contributor, two still to decide.",
  {a:"yes",b:"no",c:"todo",d:"no",e:"no",f:"todo",g:"yes"}, {a:4,g:3}, true);
</script>
</body>
</html>
