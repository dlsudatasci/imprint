# nginx site config for Imprint.
#
# Install on the VM as /etc/nginx/sites-available/imprint, then:
#   sudo ln -s /etc/nginx/sites-available/imprint /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx owns port 80 (the port your university forwards to) and proxies to the
# Next.js process on 3000. Running Node on 80 directly would need root or
# CAP_NET_BIND_SERVICE, and you'd lose static-file caching and TLS termination.

# Request limit for sign-in, sign-up and password reset (S8, 26 Oct 2026).
# This file is included in nginx's http context, where a zone must be declared.
# Per client address: 10 requests a minute, with a burst of 5 allowed at once,
# so a run of attempts is refused from the 7th (429) and one more is allowed
# every 6 seconds after that. 10m of shared memory holds about 160,000
# addresses. Only the locations below use it (see "Rate limiting" in
# DEPLOYMENT.md, including the client address check before deploying).
limit_req_zone $binary_remote_addr zone=imprint_auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;           # replace with your VM's hostname once you have one

    # The client address the request limit counts by (S8). The VMs sit behind
    # the campus gateway. If /var/log/nginx/access.log shows the gateway's
    # address for every visitor (check while signing in from a phone on mobile
    # data), every user shares one address and the limit would lock everyone
    # out together. Then take the address the gateway forwards: uncomment and
    # put the gateway's address here, or ask IT how the client address reaches
    # the VM. Do not deploy the limit until the log shows real client addresses.
    #
    # set_real_ip_from  GATEWAY_ADDRESS;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # Annotation images and the 3D scene are large; without this, uploads and
    # long payloads fail with 413 rather than an app-level error.
    client_max_body_size 10M;

    # Compress text responses. Images and fonts are already compressed.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/json application/javascript
        text/javascript application/x-javascript image/svg+xml;

    # Hashed build assets are immutable — let the browser keep them and stop
    # asking. This is where most of the repeat-visit speedup comes from.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Files in public/ are not content-hashed, so they get a short cache with
    # revalidation rather than an immutable one.
    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # Corpus images (Step 4). Served straight from disk by nginx, from a folder
    # outside the app's deploy directory, so deploy.sh's rsync --delete never
    # touches them and each deploy does not re-ship half a gigabyte. Upload with
    # rsync to /srv/imprint-images/corpus/ (see the Step 4 runbook). File names
    # never change once published, so browsers may cache them for 30 days.
    location /corpus-images/ {
        alias /srv/imprint-images/corpus/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Never cache the health endpoint.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-store";
        access_log off;
    }

    # Sign-in, sign-up and password reset, limited (S8). Exact paths only, each
    # with the same proxy settings as location / below. Never limited:
    # /api/auth/session and /api/auth/csrf (NextAuth calls them on every page),
    # /api/auth/providers and the Google callback.
    # password sign-in (NextAuth's credentials callback)
    location = /api/auth/callback/credentials {
        limit_req zone=imprint_auth burst=5 nodelay;
        error_page 429 = @imprint_auth_limited;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # sign-up
    location = /api/auth/register {
        limit_req zone=imprint_auth burst=5 nodelay;
        error_page 429 = @imprint_auth_limited;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # sends a reset email
    location = /api/auth/forgot-password {
        limit_req zone=imprint_auth burst=5 nodelay;
        error_page 429 = @imprint_auth_limited;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # sets a new password with a reset link
    location = /api/auth/reset-password {
        limit_req zone=imprint_auth burst=5 nodelay;
        error_page 429 = @imprint_auth_limited;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # checks a reset link
    location = /api/auth/verify-reset-token {
        limit_req zone=imprint_auth burst=5 nodelay;
        error_page 429 = @imprint_auth_limited;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # sends a new email confirmation link (S9)
    location = /api/auth/resend-verification {
        limit_req zone=imprint_auth burst=5 nodelay;
        error_page 429 = @imprint_auth_limited;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # A limited request's answer. JSON, because the forms and NextAuth's
    # signIn() read it: the message is the one the forms show, and the url is
    # where NextAuth sends a refused sign-in (error=TooManyAttempts). The app's
    # own 429s (the five-minute wait on resend-verification) pass through
    # unchanged, since nginx only replaces the errors it makes itself.
    location @imprint_auth_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 429 '{"message":"Too many attempts. Please wait a minute and try again.","url":"$scheme://$http_host/login?error=TooManyAttempts"}';
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Next reads these to build absolute URLs and to know the request was
        # HTTPS if you later terminate TLS here. Without X-Forwarded-Proto,
        # NextAuth can mint http:// callback URLs on an https:// site.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Upgrade headers keep HMR working if you ever run dev behind nginx.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
